specVersion: 0.0.5
description: Praman Setu IDAM indexer — identity, access control, and digital asset events (PS 26125)
repository: https://github.com/ruudrasharma/SIH2026

schema:
  file: ./schema.graphql

dataSources:

  - kind: ethereum/contract
    name: DIDRegistry
    network: sepolia   # Polygon Amoy; change to matic for mainnet
    source:
      address: "0x66F83cB562a3A7B8B6D4f1E0Eb5D364E10F536ac"
      abi: DIDRegistry
      startBlock: 11675947
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Identity
        - AuditEvent
      abis:
        - name: DIDRegistry
          file: ../artifacts/contracts/DIDRegistry.sol/DIDRegistry.json
      eventHandlers:
        - event: DIDCreated(indexed bytes32,indexed address,string,uint256)
          handler: handleDIDCreated
        - event: KeyRotated(indexed bytes32,indexed address,string,uint256)
          handler: handleKeyRotated
      file: ./src/did-registry.ts

  - kind: ethereum/contract
    name: CredentialRegistry
    network: sepolia
    source:
      address: "0x1a3B1752eb096a9Ca6ad0aD6d474396967A7f96D"
      abi: CredentialRegistry
      startBlock: 11675947
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Credential
        - AuditEvent
      abis:
        - name: CredentialRegistry
          file: ../artifacts/contracts/CredentialRegistry.sol/CredentialRegistry.json
      eventHandlers:
        - event: CredentialIssued(indexed bytes32,indexed bytes32,indexed bytes32,string,uint256)
          handler: handleCredentialIssued
        - event: CredentialRevoked(indexed bytes32,uint256)
          handler: handleCredentialRevoked
      file: ./src/credential-registry.ts

  - kind: ethereum/contract
    name: TimeBoundAccessControl
    network: sepolia
    source:
      address: "0x0a100F8c9389B723Aa0c92F63fE4F05E7737ECC3"
      abi: TimeBoundAccessControl
      startBlock: 11675947
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - RoleGrant
        - PlatformAction
        - PendingGrant
        - AuditEvent
      abis:
        - name: TimeBoundAccessControl
          file: ../artifacts/contracts/TimeBoundAccessControl.sol/TimeBoundAccessControl.json
      eventHandlers:
        - event: TimedRoleGranted(indexed bytes32,indexed address,uint256)
          handler: handleTimedRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: ActionProposed(indexed uint256,uint8,address)
          handler: handleActionProposed
        - event: ActionCoSigned(indexed uint256,address,uint256)
          handler: handleActionCoSigned
        - event: ActionExecuted(indexed uint256,uint8)
          handler: handleActionExecuted
        - event: GrantProposed(indexed uint256,bytes32,address,address)
          handler: handleGrantProposed
        - event: GrantCoSigned(indexed uint256,address,uint256)
          handler: handleGrantCoSigned
        - event: Paused(address)
          handler: handlePaused
        - event: Unpaused(address)
          handler: handleUnpaused
      file: ./src/access-control.ts

  - kind: ethereum/contract
    name: AssetRegistry
    network: sepolia
    source:
      address: "0xD403b9366697D42756bE6a2b40CBE4ADbC84f23b"
      abi: AssetRegistry
      startBlock: 11675947
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Asset
        - MintRequest
        - AuditEvent
      abis:
        - name: AssetRegistry
          file: ../artifacts/contracts/AssetRegistry.sol/AssetRegistry.json
      eventHandlers:
        - event: MintProposed(indexed uint256,string,bytes32,address)
          handler: handleMintProposed
        - event: MintCoSigned(indexed uint256,address)
          handler: handleMintCoSigned
        - event: AssetMinted(indexed uint256,indexed uint256,bytes32,string)
          handler: handleAssetMinted
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: OracleFactRecorded(indexed uint256,uint8,bytes32,indexed uint256)
          handler: handleOracleFactRecorded
      file: ./src/asset-registry.ts

  # PLACEHOLDER — OracleAttestation is not yet deployed to live Sepolia (T-016). Address/startBlock
  # below are placeholders; update both to the real deployed values (and redeploy this subgraph)
  # once the live upgrade sequence in docs/DEPLOYMENT.md's T-016 runbook actually broadcasts.
  - kind: ethereum/contract
    name: OracleAttestation
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: OracleAttestation
      startBlock: 11675947
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OracleFact
        - AuditEvent
      abis:
        - name: OracleAttestation
          file: ../artifacts/contracts/OracleAttestation.sol/OracleAttestation.json
      eventHandlers:
        - event: FactSubmitted(indexed uint256,indexed uint256,uint8,bytes32,address)
          handler: handleFactSubmitted
        - event: FactCoSigned(indexed uint256,address,uint256)
          handler: handleFactCoSigned
        - event: FactDisputed(indexed uint256,indexed address,string)
          handler: handleFactDisputed
        - event: FactDisputeResolved(indexed uint256,bool)
          handler: handleFactDisputeResolved
        - event: FactFinalized(indexed uint256,indexed uint256,uint8)
          handler: handleFactFinalized
        - event: FactRejected(indexed uint256)
          handler: handleFactRejected
      file: ./src/oracle-attestation.ts

  - kind: ethereum/contract
    name: GovernanceTimelock
    network: sepolia
    source:
      address: "0x4512A3E1C5d0e4777766001f5e67fa564E894502"
      abi: GovernanceTimelock
      startBlock: 11675947
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - GovernanceTx
        - Dispute
        - AuditEvent
      abis:
        - name: GovernanceTimelock
          file: ../artifacts/contracts/GovernanceTimelock.sol/GovernanceTimelock.json
      eventHandlers:
        - event: TransactionQueued(indexed uint256,address,uint256)
          handler: handleTransactionQueued
        - event: DisputeRaised(indexed uint256,indexed address,string)
          handler: handleDisputeRaised
        - event: DisputeResolved(indexed uint256,bool)
          handler: handleDisputeResolved
        - event: TransactionExecuted(indexed uint256)
          handler: handleTransactionExecuted
      file: ./src/governance-timelock.ts

  - kind: ethereum/contract
    name: GuardianRecovery
    network: sepolia
    source:
      address: "0xdC30F7f9616d02B04AB04f095EcCC8cB2E006Ee3"
      abi: GuardianRecovery
      startBlock: 11675947
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Recovery
        - AuditEvent
      abis:
        - name: GuardianRecovery
          file: ../artifacts/contracts/GuardianRecovery.sol/GuardianRecovery.json
      eventHandlers:
        - event: GuardiansRegistered(indexed bytes32,address[],uint8)
          handler: handleGuardiansRegistered
        - event: RecoveryInitiated(indexed bytes32,address,address)
          handler: handleRecoveryInitiated
        - event: RecoverySigned(indexed bytes32,address,uint256)
          handler: handleRecoverySigned
        - event: RecoveryFinalized(indexed bytes32,address)
          handler: handleRecoveryFinalized
      file: ./src/guardian-recovery.ts
